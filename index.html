<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E19" media="(prefers-color-scheme: dark)">
<meta name="description" content="Diary, work tasks and money tracker that works offline and syncs between devices.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Diary">
<title>Money Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a soft pastel planner — sidebar on desktop, bottom tab bar with a centre "+" on phones; pastel stat cards, a swipeable Kanban board for work, and a heat-map calendar. */
:root{
  --bg:#F4F3FA; --surface:#FFFFFF; --surface2:#F8F7FD; --ink:#17172B; --muted:#646482; --line:#E9E7F3; --track:#ECEBF5;
  --shadow:0 1px 2px rgba(23,23,43,.04),0 10px 28px rgba(76,63,160,.07);
  --dark:#17172B; --on-dark:#FFFFFF; --yellow:#FFC83D; --on-yellow:#2B2100;
  --good:#15803D; --warn:#B45309; --bad:#E11D48;
  --p-lav:#EEEAFF; --i-lav:#5442D8; --p-sky:#E3EEFF; --i-sky:#2459C9; --p-peach:#FFECDD; --i-peach:#B04D0C;
  --p-pink:#FFE5F0; --i-pink:#B8226D; --p-mint:#DDF5EA; --i-mint:#0D7449; --p-lemon:#FFF3CC; --i-lemon:#7E5800; --p-teal:#DAF4F2; --i-teal:#0B6A66;
  --t-journal:#6C5CE7; --t-work:#2F6BE8; --t-calendar:#0E8478; --t-collect:#0F8A58; --t-bills:#C2530C; --t-debts:#C9286F; --t-goals:#0E7490; --t-reports:#8A5A00;
  --on-k:#FFFFFF; --k:var(--t-journal);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --s-in:#2a78d6; --s-out:#eb6834;
  --h1:#FFF1E5; --h2:#FFDDBF; --h3:#FFBE8C; --h4:#F69350;
  --hero:#17172B; --hero-ink:#FFFFFF; --hero-muted:#B4B4CF;
  --font:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:var(--font); --display:var(--font); --body:var(--font);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E19; --surface:#181828; --surface2:#1D1D30; --ink:#ECECF7; --muted:#A4A4C2; --line:#29293F; --track:#2A2A42;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --dark:#ECECF7; --on-dark:#0E0E19;
  --good:#4ADE80; --warn:#FBBF24; --bad:#FB7185;
  --p-lav:#272247; --i-lav:#C3B9FF; --p-sky:#1B2946; --i-sky:#A2C3FF; --p-peach:#3A2618; --i-peach:#FFBC8E; --p-pink:#3D1F30; --i-pink:#FFA2CF;
  --p-mint:#16322A; --i-mint:#82E4B7; --p-lemon:#393016; --i-lemon:#FFD976; --p-teal:#153433; --i-teal:#82DED6;
  --t-journal:#A79CFF; --t-work:#82AAFF; --t-calendar:#4FD1C0; --t-collect:#4ADE9A; --t-bills:#FF9F5A; --t-debts:#FF7AB8; --t-goals:#3CD3EE; --t-reports:#FFC24B;
  --on-k:#0E0E19;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767;
  --s-in:#3987e5; --s-out:#d95926;
  --h1:#2E2219; --h2:#4A2F18; --h3:#704016; --h4:#A15417;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E19; --surface:#181828; --surface2:#1D1D30; --ink:#ECECF7; --muted:#A4A4C2; --line:#29293F; --track:#2A2A42;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --dark:#ECECF7; --on-dark:#0E0E19;
  --good:#4ADE80; --warn:#FBBF24; --bad:#FB7185;
  --p-lav:#272247; --i-lav:#C3B9FF; --p-sky:#1B2946; --i-sky:#A2C3FF; --p-peach:#3A2618; --i-peach:#FFBC8E; --p-pink:#3D1F30; --i-pink:#FFA2CF;
  --p-mint:#16322A; --i-mint:#82E4B7; --p-lemon:#393016; --i-lemon:#FFD976; --p-teal:#153433; --i-teal:#82DED6;
  --t-journal:#A79CFF; --t-work:#82AAFF; --t-calendar:#4FD1C0; --t-collect:#4ADE9A; --t-bills:#FF9F5A; --t-debts:#FF7AB8; --t-goals:#3CD3EE; --t-reports:#FFC24B;
  --on-k:#0E0E19;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767;
  --s-in:#3987e5; --s-out:#d95926;
  --h1:#2E2219; --h2:#4A2F18; --h3:#704016; --h4:#A15417;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  background-image:radial-gradient(700px 360px at 0% -8%,color-mix(in srgb,var(--p-lav) 85%,transparent),transparent 65%),radial-gradient(640px 340px at 100% -8%,color-mix(in srgb,var(--p-pink) 75%,transparent),transparent 65%);background-repeat:no-repeat}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:800}
h1{font-size:1.45rem} h2{font-size:1.05rem;font-weight:700} h3{font-size:.98rem;font-weight:700}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)} .small{font-size:.86rem} .hint{font-size:.8rem;color:var(--muted)}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--k);outline-offset:2px}

/* ---------- shell ---------- */
.side{display:none}
.main{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hello{display:flex;align-items:center;gap:10px;min-width:0}
.hello>div{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.hello strong{font-size:.98rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-size:1.05rem;
  background:conic-gradient(from 210deg,#6C5CE7,#C9286F,#F08C3C,#0F8A58,#2F6BE8,#6C5CE7)}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink);position:relative}
.sync{font-size:.72rem;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap;cursor:pointer;
  background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.top .create{display:none}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.month button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;font-size:1.15rem;display:grid;place-items:center}
.month button:hover{background:var(--surface2)}
.month strong{min-width:118px;text-align:center;font-weight:700;font-size:.9rem}
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.subnav::-webkit-scrollbar{display:none}
.subnav button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;font-size:.84rem;white-space:nowrap;display:flex;gap:6px;align-items:center}
.subnav button[aria-pressed="true"]{background:var(--k);color:var(--on-k);border-color:var(--k)}
.badge{font-size:.66rem;border-radius:99px;padding:0 6px;font-weight:800;line-height:1.6;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.badge.bad{background:var(--bad);color:#fff;border-color:var(--bad)}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.navb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;color:var(--muted);padding:5px 0;border-radius:12px;position:relative}
.navb svg{width:23px;height:23px}
.navb[aria-current="page"]{color:var(--k)}
.navb[aria-current="page"]::after{content:"";position:absolute;top:-6px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--k)}
.navb .plus{width:54px;height:54px;border-radius:19px;background:var(--dark);color:var(--on-dark);display:grid;place-items:center;margin-top:-24px;box-shadow:0 10px 22px rgba(23,23,43,.3)}
.navb .plus svg{width:26px;height:26px}
.nbadge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:.6rem;font-style:normal;font-weight:800;display:grid;place-items:center;padding:0 4px}
.nbadge:empty{display:none}

@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:4px;position:fixed;inset:0 auto 0 0;width:240px;padding:20px 14px;z-index:10;
    background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-right:1px solid var(--line)}
  .main{margin-left:240px;padding:22px 32px 48px}
  .bottom{display:none}
  .top .create{display:inline-flex}
  h1{font-size:1.7rem}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand img{width:34px;height:34px;border-radius:11px}
.brand b{font-size:1.1rem;font-weight:800}
.side-lab{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:10px 10px 4px}
.navi{border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;font-weight:600;color:var(--muted);text-align:left;width:100%}
.navi svg{width:19px;height:19px;flex:none}
.navi:hover{background:var(--surface2);color:var(--ink)}
.navi[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.navi[aria-current="page"] svg{color:var(--k)}
.navi .badge{margin-left:auto}
.side-user{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:8px}
.side-user .avatar{width:36px;height:36px;border-radius:12px;font-size:.9rem}
.side-user div{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.side-user span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.notice{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:9px 12px;color:var(--muted);font-size:.88rem}

/* ---------- generic ---------- */
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.ov{display:flex;flex-direction:row;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,color-mix(in srgb,var(--k) 13%,var(--surface)),var(--surface) 75%)}
.ov .ring{color:var(--ink)}
.ov-text{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:2px}
.ov-text .big{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.row .grow,.grow{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.stack{display:flex;flex-direction:column;gap:12px}
.t{font-weight:700}
.chip{font-size:.72rem;border-radius:99px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-weight:600}
.chip.ex{border-style:dashed}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 9%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.chip.in{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.chip.place{color:var(--k);border-color:color-mix(in srgb,var(--k) 40%,transparent);background:color-mix(in srgb,var(--k) 8%,transparent)}
.chip.cat{color:var(--ink);border-color:transparent;background:color-mix(in srgb,var(--cc) 16%,transparent)}
.chip.school{color:var(--i-lemon);border-color:transparent;background:var(--p-lemon)}
.chip.mine{color:var(--i-mint);border-color:transparent;background:var(--p-mint)}
.x{border:0;background:transparent;color:var(--muted);font-size:.8rem;padding:6px 8px;border-radius:8px}
.x:hover{background:var(--surface2);color:var(--bad)}
.x.armed{color:var(--bad);font-weight:700}
.link{border:0;background:transparent;color:var(--k);padding:0;font-size:.84rem;font-weight:700}
.link:hover{text-decoration:underline}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}
.sec-head h3{display:flex;align-items:center;gap:8px}
.sec-head h3::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--k)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.empty{text-align:center;padding:18px 14px;font-size:.9rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 15px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--k)}
.btn.primary{background:var(--k);color:var(--on-k);border-color:var(--k)}
.btn.dark{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.btn.sm{padding:6px 12px;font-size:.84rem;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--k);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 18%,transparent)}
input[type=file]{padding:8px;font-size:.85rem}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline input{flex:1 1 200px;min-width:0}
.step{display:flex;flex-direction:column;gap:6px}
.step .label{color:var(--k)}
.box{width:20px;height:20px;border-radius:50%;border:2px solid color-mix(in srgb,var(--k) 55%,var(--muted));display:grid;place-items:center;font-size:.7rem;color:transparent;flex:none;background:transparent;padding:0}
.box.on{background:var(--k);border-color:var(--k);color:var(--on-k)}
.progress{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.progress i{display:block;height:100%;background:var(--k);border-radius:99px}
.progress i.warn{background:var(--warn)} .progress i.bad{background:var(--bad)}
.ring{flex:none;display:block} .ring-t{font-family:var(--font);font-weight:800;fill:currentColor}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;gap:12px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.week-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{border:0;background:transparent;border-radius:14px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.68rem;font-weight:700}
.wd b{font-size:.98rem;color:var(--ink);width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-weight:800}
.wd.today b{background:var(--k);color:var(--on-k)}
.wd .wdots{display:flex;gap:3px;height:5px}
.wd .wdots i{width:5px;height:5px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{border:1px solid color-mix(in srgb,var(--pi) 14%,transparent);text-align:left;border-radius:22px;padding:14px;background:var(--pc);color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard .pc-lab{font-size:.7rem;font-weight:800;color:var(--pi);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.pcard .pc-lab svg{width:16px;height:16px}
.pcard b{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;margin-top:4px}
.pcard .pc-sub{font-size:.76rem;color:var(--muted);font-weight:600}
.pcard .pc-sub em{font-style:normal;color:var(--bad)}
.pbar{height:7px;border-radius:99px;background:color-mix(in srgb,var(--pi) 16%,transparent);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--pi)}
.spark svg{display:block;width:100%;height:64px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:20px;padding:12px 14px;background:var(--pc);color:var(--ink);border:1px solid color-mix(in srgb,var(--pi) 20%,transparent)}
.banner b{display:block;color:var(--pi)}
.banner .grow{display:flex;flex-direction:column}

/* journal */
.day-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.date-badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.95rem}
.date-badge span{background:var(--k);color:var(--on-k);border-radius:10px;padding:2px 8px;font-size:.82rem}
.diary{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:14px;background:var(--p-lav)}
.diary p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;min-width:0}
.mrow .mid{min-width:0;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.mchips{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}

/* ---------- work board ---------- */
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mtile{border-radius:18px;padding:10px 12px;background:var(--pc);display:flex;flex-direction:column;gap:1px;min-width:0;border:1px solid color-mix(in srgb,var(--pi) 14%,transparent);text-align:left;color:var(--ink)}
.mtile b{font-size:1.25rem;font-weight:800;color:var(--pi)}
.mtile span{font-size:.72rem;font-weight:700;color:var(--muted);line-height:1.25}
.filters{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:1px}
.filters::-webkit-scrollbar{display:none}
.filters .hint{white-space:nowrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:700;white-space:nowrap}
.filters button[aria-pressed="true"]{border-color:var(--k);background:var(--k);color:var(--on-k)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,86%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;scrollbar-width:none;overscroll-behavior-x:contain}
.board::-webkit-scrollbar{display:none}
@media (min-width:900px){.board{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}}
.col{scroll-snap-align:start;background:var(--surface2);border:1px solid var(--line);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:10px;align-self:start;min-width:0}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 4px}
.col-head .cdot{width:9px;height:9px;border-radius:50%}
.ccount{margin-left:auto;font-size:.72rem;font-weight:800;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted)}
.col-empty{font-size:.82rem;color:var(--muted);text-align:center;padding:14px 8px;border:1px dashed var(--line);border-radius:16px}
.tcard{background:var(--pc);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;border:1px solid color-mix(in srgb,var(--pi) 14%,transparent);min-width:0}
.tcard:focus-visible{outline:2px solid var(--pi)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:.68rem;font-weight:800;color:var(--pi);background:color-mix(in srgb,var(--surface) 72%,transparent);border-radius:8px;padding:2px 8px}
.tag.hot{background:var(--bad);color:#fff}
.tcard h4{font-size:.95rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.tnote{margin:0;font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-weight:700}
.pdots{display:flex;gap:4px;flex-wrap:wrap}
.pdots i{width:12px;height:12px;border-radius:50%;background:color-mix(in srgb,var(--pi) 20%,transparent)}
.pdots i.on{background:var(--pi)}
.tfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tdone{width:32px;height:32px;border-radius:50%;border:2px solid var(--pi);background:var(--surface);color:transparent;display:grid;place-items:center;font-weight:800;margin-left:auto;flex:none}
.tdone.on{background:var(--pi);color:var(--surface)}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task .box{width:24px;height:24px;margin-top:1px;cursor:pointer}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task.overdue{box-shadow:inset 3px 0 0 var(--bad);padding-left:10px}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.stps{display:flex;flex-direction:column;gap:6px}
.stp{display:flex;gap:10px;align-items:flex-start;overflow-wrap:anywhere;min-width:0}
.stp .box{width:22px;height:22px;font-size:.66rem;margin-top:1px;cursor:pointer}
.stp.done span{text-decoration:line-through;color:var(--muted)}
.trip{display:flex;align-items:center;gap:10px;border:0;background:var(--surface2);border-radius:16px;padding:8px;text-align:left;width:100%;color:inherit}
.trip .grow{display:flex;flex-direction:column}
.thumb{width:50px;height:50px;border-radius:12px;object-fit:cover;flex:none;background:var(--track);display:grid;place-items:center;font-size:.58rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.1}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.choice:hover{border-color:var(--k)}
.choice b{font-size:1rem}
.choice span{font-size:.85rem;color:var(--muted)}

/* ---------- calendar ---------- */
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-size:.66rem;font-weight:800;color:var(--muted);text-align:center;padding:2px 0;text-transform:uppercase;letter-spacing:.05em}
.cday{border:0;border-radius:12px;min-height:60px;padding:5px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;background:var(--surface2);color:var(--ink);text-align:left;min-width:0;gap:2px}
.cday.l1{background:var(--h1)} .cday.l2{background:var(--h2)} .cday.l3{background:var(--h3)} .cday.l4{background:var(--h4)}
.cday .cn{font-size:.8rem;font-weight:800;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cday.today .cn{background:var(--k);color:var(--on-k)}
.cday.sel{outline:2px solid var(--k);outline-offset:1px}
.cday .cs{font-size:.62rem;font-weight:800;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdots{display:flex;gap:3px;min-height:6px}
.cdots i{width:6px;height:6px;border-radius:50%}
.wk{background:var(--t-work)} .tv{background:var(--t-calendar)} .dy{background:var(--t-journal)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.74rem;color:var(--muted);font-weight:600}
.cal-legend .sw{display:inline-flex;gap:2px;vertical-align:middle;margin:0 4px}
.cal-legend .sw i{width:12px;height:12px;border-radius:4px;display:inline-block}
.cal-legend .lg{display:inline-flex;align-items:center;gap:5px}
.cal-legend .lg i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* item name suggestions */
.isugg{display:flex;gap:6px;flex-wrap:wrap}
.ichip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.ichip.mine{background:var(--surface2)}
.ichip:hover{border-color:var(--k)}

/* collect + people picker */
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);min-width:0;flex-wrap:wrap}
.prow:first-child{border-top:0}
.prow .box{width:26px;height:26px;cursor:pointer;font-size:.8rem}
.prow.paid .nm{color:var(--muted)}
.prow .grow{flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.owe{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 12px;font-size:.84rem;font-weight:600}
.owe:hover{border-color:var(--k);color:var(--k)}
.picker{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.pchip{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--k) 10%,var(--surface));border:1px solid var(--k);border-radius:99px;padding:2px 2px 2px 10px;font-size:.86rem}
.pchip.new{border-style:dashed}
.pchip button{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:50%;font-size:1rem;line-height:1}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:600}
.sugg button:hover{border-color:var(--k);color:var(--k)}
.sugg button.addnew{border-style:dashed;color:var(--k)}
.hbars{display:flex;flex-direction:column;gap:7px;flex:none;width:100%;min-width:0}
.hb{display:grid;grid-template-columns:minmax(0,8em) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.8rem}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:600}
.hb-t{height:9px;background:var(--track);border-radius:99px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--k);border-radius:99px}

/* money pages */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--tc) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 28%,transparent)}
.tile b{font-size:1.2rem;font-weight:800;color:var(--tc);font-variant-numeric:tabular-nums}
.goal{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.goal .ring{color:var(--ink)}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{flex:none;display:block}
.dlegend{display:flex;flex-direction:column;gap:6px;flex:1 1 180px;min-width:0;font-size:.86rem}
.dlegend .row{gap:8px;flex-wrap:nowrap}
.tick{fill:var(--muted);font:600 11px var(--font)}
.donut-v{fill:var(--ink);font:800 15px var(--font)}
.budget-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 110px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.budget-row:first-of-type{border-top:0}
.budget-row input{padding:7px 9px;font-size:.9rem}
@media (max-width:560px){.budget-row{grid-template-columns:1fr 110px}.budget-row .bp{grid-column:1/-1;order:3}}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:300px;height:auto}
.gl{stroke:var(--line);stroke-width:1}
svg [data-tip]:hover{opacity:.82}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 10px;border-radius:9px;z-index:40;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);align-items:center}
.legend .dot{margin-right:5px;vertical-align:middle}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:right;padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,14,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:26px 26px 0 0;max-height:92%;overflow:auto;overscroll-behavior:contain;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet::before{content:"";align-self:center;width:42px;height:5px;border-radius:99px;background:var(--line);flex:none}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:26px;padding-top:18px}.sheet::before{display:none}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg.seg2{grid-template-columns:1fr 1fr}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:.82rem;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--k);color:var(--on-k)}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:7px 13px;font-size:.86rem;font-weight:600}
.moods button[aria-pressed="true"]{border-color:var(--k);background:var(--k);color:var(--on-k)}
.err{color:var(--bad);font-size:.85rem;min-height:1em;font-weight:600}
.receipt-img{max-width:100%;border-radius:14px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (min-width:960px){.toast{bottom:28px}}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* calculator */
.amt{display:flex;align-items:stretch;min-width:0}
.amt input{border-top-right-radius:0;border-bottom-right-radius:0;min-width:0;flex:1}
.calc-btn{border:1px solid var(--line);border-left:0;background:color-mix(in srgb,var(--k) 13%,var(--surface));color:var(--k);border-radius:0 12px 12px 0;padding:0 12px;display:grid;place-items:center;flex:none}
.calc-out{font-size:.78rem;color:var(--k);font-weight:700}
.calc-out:empty{display:none}
.calc-out.bad{color:var(--bad)}
.inline .amt{flex:1 1 200px}
.inline .calc-out{flex-basis:100%}
.calc-scrim{z-index:35}
.calc{background:var(--surface);width:100%;max-width:380px;border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 30px rgba(0,0,0,.22);
  padding:14px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.calc{border-radius:26px}}
.calc-disp{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:12px 16px;text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.calc-expr{font-size:1.6rem;font-weight:700;overflow-wrap:anywhere;line-height:1.2;font-variant-numeric:tabular-nums}
.calc-res{color:var(--hero-muted);font-size:.9rem;min-height:1.2em;font-weight:600}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-keys button{border:0;border-radius:16px;padding:14px 0;font-size:1.2rem;font-weight:700;background:var(--surface2);color:var(--ink)}
.calc-keys button.op{background:color-mix(in srgb,var(--k) 16%,var(--surface));color:var(--k)}
.calc-keys button.fn{color:var(--muted)}
.calc-keys button:active{transform:scale(.96)}

/* reminders + settings */
.rem-head{display:flex;gap:12px;align-items:flex-start}
.rem-ico{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--k);color:var(--on-k);flex:none;font-weight:800;font-size:1.1rem}
.rs-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.9fr);gap:8px;align-items:start}
@media (max-width:520px){.rs-row{grid-template-columns:1fr 1fr}.rs-row .rs-t{grid-column:1/-1}}
.checks{display:flex;flex-direction:column}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--line);font-size:.92rem}
.checks label:first-child{border-top:0}
.checks input{width:22px;height:22px;accent-color:var(--k);flex:none;margin-top:1px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;font-weight:700;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.setrow:has(input[type=time]),.setrow:has(select){flex-wrap:wrap}
.setrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--k);flex:none}
.setrow input[type=time],.setrow select{width:auto}
.setrow label{flex:1 1 0;min-width:0}

/* sign-in */
.auth{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(90% 60% at 0% 0%,var(--p-lav),transparent 60%),radial-gradient(80% 60% at 100% 0%,var(--p-pink),transparent 60%),radial-gradient(80% 60% at 50% 100%,var(--p-mint),transparent 60%),var(--bg)}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(76,63,160,.18)}
.auth .brand{padding:0}
.auth .btn.primary{padding:12px 14px}
@media (prefers-reduced-motion:no-preference){.card,.pcard,.tcard,.week{animation:in .3s ease both}@keyframes in{from{transform:translateY(5px)}to{transform:none}}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Sections">
    <div class="brand"><img src="icon-192.png" alt=""><b>Money Diary</b></div>
    <span class="side-lab">Main</span>
    <button class="navi" data-nav="journal" data-tab="journal" style="--k:var(--t-journal)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overview</button>
    <button class="navi" data-nav="work" data-tab="work" style="--k:var(--t-work)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>Work<span class="badge" id="sbWork" hidden></span></button>
    <button class="navi" data-nav="calendar" data-tab="calendar" style="--k:var(--t-calendar)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg>Calendar</button>
    <span class="side-lab">Money</span>
    <button class="navi" data-nav="collect" data-tab="collect" style="--k:var(--t-collect)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>Collect</button>
    <button class="navi" data-nav="bills" data-tab="bills" style="--k:var(--t-bills)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h12v19l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>My bills</button>
    <button class="navi" data-nav="debts" data-tab="debts" style="--k:var(--t-debts)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>IOUs</button>
    <button class="navi" data-nav="goals" data-tab="goals" style="--k:var(--t-goals)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 9.5c1 .5 2 1.5 2 3h-1.5a6 6 0 0 1-2.5 3.6V19h-3v-1.6a7 7 0 0 1-3 0V19H8v-2.9A6 6 0 0 1 5.6 8.6 5.8 5.8 0 0 1 11 6h3l3-2v3.3a6 6 0 0 1 2 2.2z"/><path d="M15.5 10h.01"/></svg>Savings</button>

<script>
const IC={"home": "<path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"/>", "work": "<rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18\"/>", "cal": "<rect x=\"3\" y=\"4.5\" width=\"18\" height=\"16.5\" rx=\"2.5\"/><path d=\"M3 9.5h18M8 2.5v4M16 2.5v4\"/><path d=\"M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01\"/>", "users": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20a6.5 6.5 0 0 0-4-6\"/>", "bill": "<path d=\"M6 2.5h12v19l-3-2-3 2-3-2-3 2z\"/><path d=\"M9 8h6M9 12h6\"/>", "swap": "<path d=\"M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7\"/>", "piggy": "<path d=\"M19 9.5c1 .5 2 1.5 2 3h-1.5a6 6 0 0 1-2.5 3.6V19h-3v-1.6a7 7 0 0 1-3 0V19H8v-2.9A6 6 0 0 1 5.6 8.6 5.8 5.8 0 0 1 11 6h3l3-2v3.3a6 6 0 0 1 2 2.2z\"/><path d=\"M15.5 10h.01\"/>", "chart": "<path d=\"M3 21h18M6 17v-5M11 17V7M16 17v-8M21 17v-3\"/>", "gear": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/>", "bell": "<path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9\"/><path d=\"M10.3 21a1.94 1.94 0 0 0 3.4 0\"/>", "plus": "<path d=\"M12 5v14M5 12h14\"/>", "wallet": "<path d=\"M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3\"/><path d=\"M21 10h-5a2 2 0 0 0 0 4h5z\"/>", "plane": "<path d=\"M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z\"/>", "download": "<path d=\"M12 3v12M7 10l5 5 5-5M5 21h14\"/>", "camera": "<path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z\"/><circle cx=\"12\" cy=\"13\" r=\"3.5\"/>"};

/* ---------- constants & helpers ---------- */
const CATS=[["Grocery","--c1"],["Food","--c2"],["Transport","--c3"],["Bills","--c4"],["Shopping","--c5"],["Health","--c6"],["Fun","--c7"],["Other","--c8"]];
const catColor=c=>`var(${(CATS.find(x=>x[0]===c)||CATS[7])[1]})`;
const MOODS=["😀 Great","🙂 Good","😐 Okay","😔 Low","😫 Stressed"];
const SECTIONS={journal:["Overview","--t-journal"],work:["Work","--t-work"],calendar:["Calendar","--t-calendar"],collect:["Collect","--t-collect"],bills:["My bills","--t-bills"],debts:["IOUs","--t-debts"],goals:["Savings","--t-goals"],reports:["Reports","--t-reports"]};
const MONEY=["collect","bills","debts","goals","reports"];
const TABC=Object.fromEntries(Object.entries(SECTIONS).map(([k,v])=>[k,v[1]]));
const COLS=["entries","work","recurring","collections","people","goals","debts","settings","receipts","travel"];
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const todayStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const ymOf=d=>(d||"").slice(0,7);
const S={entries:[],work:[],recurring:[],collections:[],people:[],goals:[],debts:[],settings:[],receipts:[],travel:[],uid:"",lastPull:"",lastSync:0,
  month:ymOf(todayStr),tab:"journal",moneyTab:"collect",calDay:"",cur:"₱",owner:true,collectView:"month",workPlace:"",addDate:""};
try{const c=localStorage.getItem("md-cur");if(c)S.cur=c;const t=localStorage.getItem("md-tab");if(t&&SECTIONS[t])S.tab=t;const mt=localStorage.getItem("md-mtab");if(mt&&MONEY.includes(mt))S.moneyTab=mt}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>S.cur+" "+fmt(n);
const shortNum=v=>{v=+v||0;const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(a%1e6?1:0)+"M":a>=1e3?(v/1e3).toFixed(a%1e3?1:0)+"k":String(Math.round(v))};
const monthName=ym=>{const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})};
const monthShort=ym=>{const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"short"})};
const mOnly=ym=>monthName(ym).split(" ")[0];
const shiftMonth=(ym,d)=>{const [y,m]=ym.split("-").map(Number);const t=new Date(y,m-1+d,1);return `${t.getFullYear()}-${pad(t.getMonth()+1)}`};
const dayName=d=>{if(!d)return"";const [y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})};
const weekday=d=>{const [y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:"long"})};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const exChip=o=>o.example?'<span class="chip ex">Example</span>':"";
const sum=(arr,f)=>arr.reduce((a,x)=>a+(+f(x)||0),0);
const strip=o=>{const {id,...rest}=o;return rest};
const ordinal=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const PASTELS=["lav","sky","mint","peach","teal","lemon"];
const pastelFor=s=>{let h=0;for(const ch of String(s||""))h=(h*31+ch.charCodeAt(0))>>>0;return PASTELS[h%PASTELS.length]};
const pv=n=>`--pc:var(--p-${n});--pi:var(--i-${n})`;
const icon=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||""}</svg>`;

function toast(msg){$("toastHost").innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$("toastHost").innerHTML="",2600)}
function arm(t){if(t.classList.contains("armed"))return true;const o=t.textContent;t.classList.add("armed");t.textContent=o==="✕"?(t.dataset.rmmember?"Remove?":"Delete?"):"Sure?";setTimeout(()=>{t.classList.remove("armed");t.textContent=o},3000);return false}
function copyText(title,text){try{navigator.clipboard.writeText(text).then(()=>toast("Copied. Paste it in your chat or report."),()=>showText(title,text))}catch(e){showText(title,text)}}
function saveBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast("Downloaded "+name)}

/* ---------- common things people buy (pick one and the category fills in) ---------- */
const ITEMS={
  Grocery:"Rice, Eggs, Chicken, Pork, Beef, Fish, Dried fish, Vegetables, Fruits, Bread, Pandesal, Milk, Coffee, Sugar, Salt, Cooking oil, Soy sauce, Vinegar, Garlic, Onion, Canned goods, Sardines, Corned beef, Noodles, Pancit canton, Hotdog, Butter, Cheese, Biscuits, Snacks, Drinking water, Softdrinks, Juice, Ice, Groceries",
  Food:"Breakfast, Lunch, Dinner, Merienda, Fast food, Jollibee, McDonald's, Chowking, Mang Inasal, Milk tea, Coffee shop, Street food, Food delivery, Bakery, Carinderia, Pasalubong",
  Transport:"Jeepney fare, Tricycle fare, Bus fare, Van fare, Habal-habal, Taxi, Grab, Boat fare, Gasoline, Diesel, Parking, Toll, Motor maintenance",
  Bills:"Electricity, Water bill, Internet, Mobile load, Postpaid plan, Rent, Cable TV, Netflix, Spotify, GCash fee, Bank fee, Insurance, SSS, Pag-IBIG, PhilHealth, Loan payment, Paylater payment",
  Shopping:"Clothes, Shoes, Bag, Shopee order, Lazada order, Shampoo, Soap, Toothpaste, Detergent, Fabric conditioner, Tissue, Diapers, Baby needs, Household items, Kitchen items, Phone accessories, Gadget, School supplies",
  Health:"Medicine, Vitamins, Check-up, Dental, Laboratory test, Eyeglasses, Pharmacy, Hospital",
  Fun:"Movie, Gift, Birthday, Party, Outing, Resort, Hotel, Travel, Games, Salon, Haircut, Hobby",
  Other:"Church offering, Tithes, Donation, Photocopy, Printing, Laundry, Allowance, Padala, Contribution, Repair, Pet food"};
const ITEM_LIST=Object.entries(ITEMS).flatMap(([c,s])=>s.split(", ").map(n=>({n,c})));
const QUICK_ITEMS=["Rice","Lunch","Jeepney fare","Tricycle fare","Mobile load","Snacks","Coffee","Groceries","Medicine","Electricity","Photocopy","Merienda"];
const INCOME_ITEMS=["Salary (15th)","Salary (30th)","Bonus","Mid-year bonus","Year-end bonus","PBB","Clothing allowance","Sideline","Refund","Gift","Interest"];
function itemHistory(){const m=new Map();
  for(const e of S.entries){if(e.kind!=="expense"||!e.title)continue;const k=e.title.trim().toLowerCase();const o=m.get(k)||{n:e.title.trim(),c:e.category,count:0,amt:0,t:0};
    o.count++;if((e.createdAt||0)>=o.t){o.amt=e.amount;o.c=e.category||o.c;o.t=e.createdAt||0;o.n=e.title.trim()}m.set(k,o)}return m}
function itemSuggest(q,limit=12){const h=itemHistory();q=(q||"").trim().toLowerCase();
  const hist=[...h.values()].sort((a,b)=>b.count-a.count||b.t-a.t).map(x=>({n:x.n,c:x.c,amt:x.amt,mine:true}));
  if(!q)return [...hist.slice(0,6),...QUICK_ITEMS.map(n=>ITEM_LIST.find(x=>x.n===n)).filter(x=>x&&!h.has(x.n.toLowerCase()))].slice(0,limit);
  const pool=[...hist,...ITEM_LIST.filter(x=>!h.has(x.n.toLowerCase()))];
  return pool.filter(x=>x.n.toLowerCase().includes(q)).sort((a,b)=>a.n.toLowerCase().indexOf(q)-b.n.toLowerCase().indexOf(q)||(b.mine?1:0)-(a.mine?1:0)).slice(0,limit)}
const itemCat=n=>{const k=(n||"").trim().toLowerCase();if(!k)return"";const h=itemHistory().get(k);return h?.c||ITEM_LIST.find(x=>x.n.toLowerCase()===k)?.c||""};
let itemListKey="";
function refreshItemList(){const names=[...new Set([...[...itemHistory().values()].map(x=>x.n),...ITEM_LIST.map(x=>x.n)])];const key=names.length+":"+names[0];
  if(key===itemListKey)return;itemListKey=key;$("itemListHost").innerHTML=`<datalist id="itemList">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`}

/* ---------- derived numbers ---------- */
const expOf=ym=>S.entries.filter(e=>e.kind==="expense"&&ymOf(e.date)===ym);
const incOf=ym=>S.entries.filter(e=>e.kind==="income"&&ymOf(e.date)===ym);
const limits=()=>(S.settings.find(s=>s.id==="budgets")||{}).limits||{};
const recPaid=(r,ym)=>S.entries.find(e=>e.recurringId===r.id&&ymOf(e.date)===ym);
const isPending=w=>w.status!=="done";
const debtLeft=d=>Math.max(0,(+d.amount||0)-sum(d.payments||[],p=>p.amount));
const sumDeposits=g=>sum(g.deposits||[],d=>d.amount);
const spentOnDay=d=>sum(S.entries.filter(e=>e.kind==="expense"&&e.date===d),e=>e.amount);

/* collect: things you sell / collect money for */
const mIdx=ym=>{const [y,m]=ym.split("-").map(Number);return y*12+m-1};
const ymFromIdx=i=>`${Math.floor(i/12)}-${pad(i%12+1)}`;
const colActive=(c,ym)=>{const d=mIdx(ym)-mIdx(c.start);return d>=0&&(!(+c.months)||d<+c.months)};
const colEnd=c=>+c.months?ymFromIdx(mIdx(c.start)+(+c.months)-1):"";
const colLabel=(c,ym)=>+c.months===1?"One-time":!(+c.months)?"Every month":`Month ${mIdx(ym)-mIdx(c.start)+1} of ${c.months}`;
const person=id=>S.people.find(p=>p.id===id);
const members=c=>(c.members||[]).filter(m=>person(m.pid));
const memberActive=(c,m,ym)=>colActive(c,ym)&&(!m.from||ym>=m.from);
const paidRec=(c,ym,pid)=>c.paid?.[ym]?.[pid];
const byName=(a,b)=>(person(a.pid)?.name||"").localeCompare(person(b.pid)?.name||"");
const groups=()=>[...new Set(S.people.map(p=>p.group||"").filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const groupDatalist=()=>`<datalist id="groupList">${groups().map(g=>`<option value="${esc(g)}">`).join("")}</datalist>`;
const isSchool=c=>c.goesTo==="school";
function collectedRecs(ym){const out=[];for(const c of S.collections)for(const [mo,recs] of Object.entries(c.paid||{}))for(const [pid,r] of Object.entries(recs||{}))if(r&&ymOf(r.date)===ym)out.push({c,mo,pid,r});return out}
const collectedIn=ym=>sum(collectedRecs(ym).filter(x=>!isSchool(x.c)),x=>x.r.amount);
const incomeIn=ym=>sum(incOf(ym),e=>e.amount)+collectedIn(ym);
const collectedTotal=c=>sum(Object.values(c.paid||{}).flatMap(o=>Object.values(o||{})),r=>r&&r.amount);
const holding=c=>isSchool(c)?Math.max(0,collectedTotal(c)-sum(c.handed||[],h=>h.amount)):0;
function collectMonth(ym){let exp=0,got=0,unpaid=0;
  for(const c of S.collections){if(!colActive(c,ym))continue;for(const m of members(c)){if(!memberActive(c,m,ym))continue;
    exp+=+c.amount||0;const r=paidRec(c,ym,m.pid);if(r)got+=+r.amount||0;else unpaid++}}
  return {exp,got,unpaid}}
function owedList(){const nowYm=ymOf(todayStr);const map={};
  for(const c of S.collections)for(const m of members(c)){
    let ym=m.from&&m.from>c.start?m.from:c.start;
    while(ym<=nowYm&&colActive(c,ym)){if(!paidRec(c,ym,m.pid))(map[m.pid]=map[m.pid]||[]).push({c,ym,amount:+c.amount||0});ym=shiftMonth(ym,1)}}
  return Object.entries(map).map(([pid,items])=>({pid,items,total:sum(items,i=>i.amount)})).sort((a,b)=>b.total-a.total)}

/* ---------- charts ---------- */
function sparkSvg(ym){const [y,m]=ym.split("-").map(Number);const n=new Date(y,m,0).getDate();
  const vals=[...Array(n)].map((_,i)=>spentOnDay(`${ym}-${pad(i+1)}`));
  const max=Math.max(...vals,1);const W=310,H=64,gap=2,bw=(W-gap*(n-1))/n;
  return {max:Math.max(...vals),maxDay:vals.indexOf(Math.max(...vals))+1,
    svg:`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Spending per day in ${esc(monthName(ym))}">${vals.map((v,i)=>{const d=`${ym}-${pad(i+1)}`;const h=v?Math.max(4,v/max*(H-2)):3;
      return `<rect x="${(i*(bw+gap)).toFixed(2)}" y="${(H-h).toFixed(2)}" width="${bw.toFixed(2)}" height="${h.toFixed(2)}" rx="2" fill="${v?(d===todayStr?"var(--ink)":"var(--s-out)"):"var(--track)"}" data-tip="${esc(dayName(d))}: ${v?esc(money(v)):"no spending"}"/>`}).join("")}</svg>`}}

/* Travel + Certificates of Appearance */
async function compressImage(file,max=1500,q=.8){
  const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});

function buildPdf(cover,pages){
  const enc=new TextEncoder();const objs=[];const add=o=>(objs.push(o),objs.length);

  let lines=cover.lines.slice(),first=true;
  do{const chunk=lines.splice(0,36);let y=H-M-14,c="";
    if(first){c+=`BT /F2 18 Tf ${M} ${y} Td (${pdfStr(cover.title)}) Tj ET\n`;y-=20;c+=`BT /F1 10 Tf ${M} ${y} Td (${pdfStr(cover.sub)}) Tj ET\n`;y-=30}

    page(`BT /F2 13 Tf ${M} ${H-M-12} Td (${pdfStr(p.title)}) Tj ET\nBT /F1 10 Tf ${M} ${H-M-28} Td (${pdfStr(p.sub)}) Tj ET\nq ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im${i} Do Q`,`/Im${i} ${im} 0 R`)});
  objs[cat-1]=`<< /Type /Catalog /Pages ${pgs} 0 R >>`;objs[pgs-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;

/* Reports: donut + budgets + 6-month trend */

  const by={};exp.forEach(e=>by[e.category||"Other"]=(by[e.category||"Other"]||0)+(+e.amount||0));
  const parts=CATS.map(([c])=>({c,v:by[c]||0,color:catColor(c),label:`${c}: ${money(by[c]||0)}`}));
  const months=[...Array(6)].map((_,i)=>shiftMonth(S.month,i-5));
  const rows=months.map(m=>({m,inc:incomeIn(m),out:sum(expOf(m),e=>e.amount)}));
  $("view").innerHTML=`
    <article class="card"><div class="row"><h2 class="grow">Where the money went</h2><span class="muted small">${esc(monthName(S.month))}</span></div>
      ${spent?`<div class="donut-wrap">${donut(parts,spent)}
        <div class="dlegend">${parts.filter(p=>p.v).map(p=>`<div class="row"><span class="dot" style="background:${p.color}"></span><span class="grow">${esc(p.c)}</span><span class="num">${money(p.v)}</span><span class="muted small" style="width:3.2em;text-align:right">${Math.round(p.v/spent*100)}%</span></div>`).join("")}</div></div>`
      :`<span class="muted">No expenses in ${esc(monthName(S.month))} yet.</span>`}</article>
    <article class="card"><div><h2>Monthly budget</h2><span class="muted small">Set a limit per category. Leave it blank for no limit.</span></div>
      <div>${CATS.map(([c])=>{const v=by[c]||0,l=+L[c]||0,p=l?v/l*100:0;const st=!l?"":p>100?"bad":p>=80?"warn":"";
        return `<div class="budget-row"><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)}</span>
          <div class="bp stack" style="gap:3px">${l?`<div class="progress"><i class="${st}" style="width:${Math.min(100,p)}%;${st?"":`background:${catColor(c)}`}"></i></div>`:""}
            <span class="small ${st?"":"muted"}" style="${st==="bad"?"color:var(--bad)":st==="warn"?"color:var(--warn)":""}"><span class="num">${money(v)}</span>${l?` of ${money(l)} · ${p>100?`over by ${money(v-l)}`:p>=80?`${Math.round(p)}%, getting close`:`${money(l-v)} left`}`:""}</span></div>
          <input type="number" min="0" step="1" inputmode="decimal" data-budget="${esc(c)}" id="bud-${esc(c)}" value="${l||""}" placeholder="No limit" aria-label="${esc(c)} monthly limit"></div>`}).join("")}</div></article>
    <article class="card"><div class="row"><h2 class="grow">Last 6 months</h2>
      <span class="legend"><span><span class="dot" style="background:var(--s-in)"></span>Income + collected</span><span><span class="dot" style="background:var(--s-out)"></span>Spent</span></span></div>
      <div class="chart-wrap">${trendSvg(rows)}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Month</th><th>Income</th><th>Spent</th><th>Left</th></tr></thead><tbody>
      ${rows.slice().reverse().map(r=>`<tr><td>${esc(monthName(r.m))}</td><td class="num">${fmt(r.inc)}</td><td class="num">${fmt(r.out)}</td><td class="num" style="${r.inc-r.out<0?"color:var(--bad)":""}">${r.inc-r.out<0?"−":""}${fmt(Math.abs(r.inc-r.out))}</td></tr>`).join("")}
      </tbody></table></div></article>`;
}
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function trendSvg(rows){
  const W=600,H=220,l=56,r=8,t=10,b=26,ih=H-t-b,iw=W-l-r;
  const max=niceMax(Math.max(...rows.flatMap(x=>[x.inc,x.out])));
  const y=v=>t+ih-(v/max)*ih;const gw=iw/rows.length,bw=Math.min(26,gw/3);
  const ticks=[0,.25,.5,.75,1].map(f=>f*max);
  const bar=(x,v,col,lab)=>{const h=Math.max(0,t+ih-y(v));if(!h)return"";const rr=Math.min(4,h);
    return `<path d="M${x},${t+ih} V${t+ih-h+rr} Q${x},${t+ih-h} ${x+rr},${t+ih-h} H${x+bw-rr} Q${x+bw},${t+ih-h} ${x+bw},${t+ih-h+rr} V${t+ih} Z" fill="${col}" data-tip="${esc(lab)}"/>`};
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending for the last 6 months">
    ${ticks.map(v=>`<line class="gl" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${l-8}" y="${y(v)+4}" text-anchor="end">${shortNum(v)}</text>`).join("")}
    ${rows.map((d,i)=>{const cx=l+gw*i+gw/2;
      return `<rect x="${l+gw*i}" y="${t}" width="${gw}" height="${ih}" fill="transparent" data-tip="${esc(monthName(d.m))}: income ${esc(money(d.inc))} · spent ${esc(money(d.out))}"/>`+
      bar(cx-bw-1,d.inc,"var(--s-in)",`${monthName(d.m)} income: ${money(d.inc)}`)+bar(cx+1,d.out,"var(--s-out)",`${monthName(d.m)} spent: ${money(d.out)}`)+
      `<text class="tick" x="${cx}" y="${H-8}" text-anchor="middle" style="${d.m===S.month?"fill:var(--ink);font-weight:600":""}">${esc(monthShort(d.m))}</text>`}).join("")}
  </svg>`;
}

/* ---------- calculator for every amount field ---------- */
const CALC_ICON=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg>`;
function amtInput(id,o={}){return `<span class="amt"><input id="${id}" type="text" inputmode="decimal" autocomplete="off" data-amount ${o.required===false?"":"required"} placeholder="${esc(o.ph||"0.00")}" aria-label="${esc(o.aria||"Amount")}" value="${esc(o.value??"")}"><button type="button" class="calc-btn" data-calc="${id}" aria-label="Open calculator" title="Calculator">${CALC_ICON}</button></span><span class="calc-out" data-out="${id}"></span>`}
function calcEval(src){
  const s=String(src??"").replace(/,/g,"").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/\s+/g,"");if(!s)return NaN;
  let i=0;
  const num=()=>{if(s[i]==="("){i++;const v=expr();if(s[i]!==")")throw 0;i++;return v}
    if(s[i]==="-"){i++;return -num()}if(s[i]==="+"){i++;return num()}
    const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const term=()=>{let v=num();while(s[i]==="*"||s[i]==="/"){const o=s[i++];const r=num();v=o==="*"?v*r:v/r}return v};
  const expr=()=>{let v=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=term();v=o==="+"?v+r:v-r}return v};
  try{const v=expr();if(i!==s.length||!isFinite(v))return NaN;return Math.round(v*100)/100}catch(e){return NaN}}
document.addEventListener("input",ev=>{const inp=ev.target;if(!inp.matches?.("[data-amount]"))return;
  const out=document.querySelector(`[data-out="${inp.id}"]`);if(!out)return;
  const s=inp.value.trim(),v=calcEval(s),hasOp=/[+*/×÷−()]|\d\s*-/.test(s);
  out.classList.toggle("bad",!!s&&isNaN(v));out.textContent=!s?"":isNaN(v)?"Check this amount":hasOp?"= "+money(v):""});
let calcTarget=null,calcExpr="";
function openCalc(id){const inp=$(id);if(!inp)return;calcTarget=id;
  calcExpr=(inp.value||"").replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−").replace(/\s+/g,"");
  const keys=["C","⌫","÷","×","7","8","9","−","4","5","6","+","1","2","3","(","0",".","00",")"];
  $("calcHost").innerHTML=`<div class="scrim calc-scrim" id="calcScrim"><div class="calc" role="dialog" aria-label="Calculator">
    <div class="calc-disp"><div class="calc-expr" id="cExpr"></div><div class="calc-res" id="cRes"></div></div>
    <div class="calc-keys">${keys.map(k=>`<button type="button" data-k="${k}" class="${"÷×−+".includes(k)?"op":"C⌫()".includes(k)?"fn":""}" aria-label="${{"⌫":"Backspace","C":"Clear","−":"Minus","×":"Times","÷":"Divide"}[k]||k}">${k}</button>`).join("")}</div>
    <div class="row" style="flex-wrap:nowrap"><button type="button" class="btn" id="cCancel">Cancel</button><button type="button" class="btn primary" id="cUse" style="flex:1">Use</button></div></div></div>`;
  calcShow();
  $("calcScrim").onclick=e=>{if(e.target.id==="calcScrim")return closeCalc();const b=e.target.closest("button");if(!b)return;
    if(b.id==="cCancel")return closeCalc();if(b.id==="cUse")return useCalc();if(b.dataset.k)calcKey(b.dataset.k)}}
function calcKey(k){const last=calcExpr.slice(-1);
  if(k==="C")calcExpr="";else if(k==="⌫")calcExpr=calcExpr.slice(0,-1);
  else if("÷×+".includes(k)&&last&&"÷×−+".includes(last))calcExpr=calcExpr.slice(0,-1)+k;
  else calcExpr+=k;calcShow()}
function calcShow(){const v=calcEval(calcExpr),ok=!isNaN(v);$("cExpr").textContent=calcExpr||"0";
  $("cRes").textContent=calcExpr&&/[÷×−+()]/.test(calcExpr)?(ok?"= "+money(v):"…"):"";
  $("cUse").disabled=!ok;$("cUse").textContent=ok?"Use "+money(v):"Use"}
function useCalc(){const v=calcEval(calcExpr);if(isNaN(v))return;const inp=$(calcTarget);
  if(inp){inp.value=String(v);inp.dispatchEvent(new Event("input",{bubbles:true}))}closeCalc()}
function closeCalc(){$("calcHost").innerHTML="";calcTarget=null}
document.addEventListener("keydown",e=>{if(!$("calcHost").innerHTML)return;const k=e.key;const map={"*":"×","x":"×","/":"÷","-":"−","+":"+",".":".","(":"(",")":")"};
  if(/^[0-9]$/.test(k))calcKey(k);else if(map[k])calcKey(map[k]);else if(k==="Backspace")calcKey("⌫");else if(k==="Escape")closeCalc();else if(k==="Enter"||k==="=")useCalc();else return;e.preventDefault()});


/* ---------- reminders (pop up inside the app) ---------- */
const R0={spendOn:true,spendTime:"20:00",workOn:true,workTime:"17:00",spend:[],work:[]};
const rem=()=>({...R0,...strip(S.settings.find(s=>s.id==="reminders")||{})});
const dayStr=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const hmNow=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const isWeekday=ds=>{const [y,m,d]=ds.split("-").map(Number);const w=new Date(y,m-1,d).getDay();return w>0&&w<6};
const yesterdayStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return dayStr(d)};
const nextWorkday=()=>{const d=new Date();do{d.setDate(d.getDate()+1)}while(d.getDay()===0||d.getDay()===6);return dayStr(d)};
const fmtTime=hm=>{const [h,m]=(hm||"17:00").split(":").map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})};
const snoozeMem={};
const snoozed=k=>Math.max(+(LS.get("md-snooze-"+k)||0),snoozeMem[k]||0)>Date.now();
const snooze=(k,mins=60)=>{const t=Date.now()+mins*6e4;snoozeMem[k]=t;LS.set("md-snooze-"+k,String(t))};
const spentOn=d=>S.entries.some(e=>e.kind==="expense"&&e.date===d);

function checkReminders(){
  if(!S.owner||!S.ready||!$("auth").hidden||$("sheetHost").innerHTML||$("calcHost").innerHTML)return;
  const r=rem(),hm=hmNow(),t=dayStr(new Date());
  if(r.workOn&&isWeekday(t)&&hm>=r.workTime&&!r.work.includes(t)&&!snoozed("work-"+t))return openWorkReminder(t);
  if(r.spendOn&&hm>=r.spendTime&&!spentOn(t)&&!r.spend.includes(t)&&!snoozed("spend-"+t))return openSpendReminder(t);
  const y=yesterdayStr();
  if(r.spendOn&&S.entries.some(e=>e.date&&e.date<=y)&&!spentOn(y)&&!r.spend.includes(y)&&!snoozed("spend-"+y))return openSpendReminder(y);
}

function openWorkReminder(date){
  const pend=S.work.filter(isPending).sort((a,b)=>(a.priority==="high"?0:1)-(b.priority==="high"?0:1)||(a.due||"9999").localeCompare(b.due||"9999"));
  const urgent=pend.filter(w=>w.priority==="high");
  const traveled=S.travel.find(t=>t.date===date);
  overlay(`<form class="stack" id="remWork" style="--k:var(--t-work)">
    <div class="rem-head"><div class="rem-ico">${icon("work",22)}</div><div class="grow"><h2>How was work today?</h2>
      <span class="muted small">It's after ${esc(fmtTime(rem().workTime))}. Write down what you did, any urgent requests, and your travel before you go home.</span></div><button type="button" class="x" data-close>Close</button></div>
    ${pend.length?`<div><span class="label">Tick what you finished today</span><div class="checks">${pend.slice(0,12).map(w=>`<label><input type="checkbox" value="${esc(w.id)}"><span>${esc(w.title)}${w.priority==="high"?' <span class="chip bad">Urgent</span>':""}${w.place?` <span class="muted small">· ${esc(w.place)}</span>`:""}</span></label>`).join("")}</div></div>`:""}
    <label class="f">${pend.length?"Anything else you did today?":"What did you do at work today?"} One per line.<textarea id="rw-done" style="min-height:76px" placeholder="Encoded payroll&#10;Answered parents' inquiries"></textarea></label>
    <label class="f">Urgent requests you received. One per line.<textarea id="rw-urg" style="min-height:64px" placeholder="Principal needs the inventory report"></textarea></label>
    <div class="grid2"><label class="f">Due date for urgent requests<input id="rw-due" type="date" value="${nextWorkday()}"></label>
      <label class="f">Where to process (optional)<input id="rw-place" list="placeList2" autocomplete="off" placeholder="e.g. Division Office"></label></div>
    <datalist id="placeList2">${[...new Set([...places(),...S.travel.map(t=>t.destination)])].filter(Boolean).map(p=>`<option value="${esc(p)}">`).join("")}</datalist>
    <div class="step" style="--k:var(--t-calendar)"><span class="label">Did you travel for work today?</span>
      ${traveled?`<span class="small">Already logged: <b>${esc(traveled.destination)}</b>${traveled.photo?" with CA photo.":". You can add the CA photo from Work → Travel."}</span>`:`
      <div class="moods" id="rw-trav"><button type="button" data-v="no" aria-pressed="true">No</button><button type="button" data-v="yes" aria-pressed="false">Yes, I traveled</button></div>
      <div id="rw-trav-f" class="stack" hidden style="gap:10px">
        <label class="f">Where did you go?<input id="rw-dest" list="placeList2" autocomplete="off" placeholder="e.g. Division Office"></label>
        <label class="f">Purpose (optional)<input id="rw-purp" placeholder="e.g. Submitted step increment papers"></label>
        <label class="f">Photo of your Certificate of Appearance<input id="rw-ca" type="file" accept="image/*"></label>
        <span class="hint">No photo yet? Save now and add it later from Work → Travel.</span></div>`}</div>
    ${urgent.length?`<div class="small"><span class="label" style="color:var(--bad)">Still urgent</span><br>${urgent.map(w=>esc(w.title)).join(" · ")}</div>`:""}
    <div class="err" id="rw-err"></div>
    <div class="row"><button class="btn dark" id="rw-save">Save</button><button type="button" class="btn" id="rw-none">Nothing to add</button><button type="button" class="btn" id="rw-later">Remind me later</button></div>
  </form>`);
  sheetOnClose=()=>snooze("work-"+date);
  let trav=false;
  if($("rw-trav"))$("rw-trav").onclick=e=>{const b=e.target.closest("button");if(!b)return;trav=b.dataset.v==="yes";
    $("rw-trav").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("rw-trav-f").hidden=!trav;if(trav)$("rw-dest").focus()};
  $("rw-later").onclick=()=>closeSheet();
  $("rw-none").onclick=async()=>{sheetOnClose=null;closeSheet();await markAnswered("work",date);toast("Okay. See you tomorrow!")};
  $("remWork").onsubmit=async e=>{e.preventDefault();
    const ticked=[...$("remWork").querySelectorAll(".checks input:checked")].map(i=>i.value);
    const lines=id=>$(id).value.split("\n").map(s=>s.trim()).filter(Boolean);
    const doneLines=lines("rw-done"),urg=lines("rw-urg"),due=$("rw-due").value,place=$("rw-place").value.trim();
    let tripRec=null;
    if(trav){const dest=$("rw-dest").value.trim();if(!dest){$("rw-err").textContent="Write where you went, or tap No.";return}
      let photo=null;const f=$("rw-ca").files?.[0];
      if(f){$("rw-save").disabled=true;$("rw-save").textContent="Saving photo…";try{photo=await compressImage(f)}catch(x){$("rw-err").textContent="That photo couldn't be read. Try another, or save without it.";$("rw-save").disabled=false;$("rw-save").textContent="Save";return}}
      tripRec={destination:dest,purpose:$("rw-purp").value.trim(),date,photo,createdAt:Date.now()}}
    sheetOnClose=null;closeSheet();const c=Date.now();
    for(const id of ticked){const w=S.work.find(x=>x.id===id);if(w)await save("work",id,{...strip(w),status:"done",doneOn:date})}
    for(const [k,title] of doneLines.entries())await save("work",uid(),{title,status:"done",priority:"normal",due:"",place:"",steps:[],note:"",createdOn:date,doneOn:date,createdAt:c+k});
    for(const [k,title] of urg.entries())await save("work",uid(),{title,status:"pending",priority:"high",due,place,steps:[],note:"",createdOn:date,doneOn:"",createdAt:c+100+k});
    if(tripRec)await save("travel",uid(),tripRec);
    await markAnswered("work",date);
    toast(`Saved: ${ticked.length+doneLines.length} done${urg.length?`, ${urg.length} urgent`:""}${tripRec?", travel logged":""}`)};
}
function openSettings(){const r=rem(),off=navigator.onLine===false,n=OUT.length;
  overlay(`<form class="stack" id="setForm">
    <div class="row"><h2 class="grow">Settings</h2><button type="button" class="x" data-close>Close</button></div>
    <div class="card" style="box-shadow:none;--k:var(--t-journal)"><div class="setrow"><input type="checkbox" id="st-spend" ${r.spendOn?"checked":""}><label for="st-spend">Ask what I spent when nothing is logged for the day</label></div>
      <div class="setrow"><span class="hint">Ask after</span><input type="time" id="st-spendTime" value="${esc(r.spendTime)}" aria-label="Spending reminder time"></div></div>
    <div class="card" style="box-shadow:none;--k:var(--t-work)"><div class="setrow"><input type="checkbox" id="st-work" ${r.workOn?"checked":""}><label for="st-work">Ask what I did at work, about urgent requests and travel, Monday to Friday</label></div>
      <div class="setrow"><span class="hint">Ask after</span><input type="time" id="st-workTime" value="${esc(r.workTime)}" aria-label="Work reminder time"></div></div>
    <p class="hint" style="margin:0">Reminders pop up inside Money Diary while it's open, or the next time you open it. Your phone can't show them while the app is closed, so a phone alarm at 5 PM helps.</p>
    <div class="row"><button type="button" class="btn sm" id="st-trySpend">Try spending reminder</button><button type="button" class="btn sm" id="st-tryWork">Try work reminder</button></div>
    <div class="card" style="box-shadow:none"><div class="setrow"><label for="st-cur">Currency</label><select id="st-cur">${["₱","$","€","£","¥","₹","RM","Rp"].map(c=>`<option ${c===S.cur?"selected":""}>${c}</option>`).join("")}</select></div></div>
    <div class="card" style="box-shadow:none"><span class="label">Account & sync</span>
      <span class="small">Signed in as <b>${esc(AUTH.session?.user?.email||"")}</b></span>
      <span class="small">${off?"You're offline. ":""}${n?`${n} change${n>1?"s are":" is"} waiting to sync.`:"Everything is synced."}${S.lastSync?` Last synced ${esc(timeAgo(S.lastSync))}.`:""}</span>
      <span class="hint">Money Diary works without internet. Everything is saved on this device first, then synced to your account so your phone and computer match.</span>
      <div class="row"><button type="button" class="btn sm" id="st-sync">Sync now</button><button type="button" class="btn sm" id="st-out">Sign out</button></div></div>
    ${isStandalone()?"":`<div class="card" style="box-shadow:none"><span class="label">Install on this device</span>
      <span class="hint">${installEvt?"Add Money Diary to your home screen so it opens like an app, even with no internet.":"iPhone (Safari): tap Share, then Add to Home Screen. Android (Chrome): tap ⋮, then Install app or Add to Home screen."}</span>
      ${installEvt?`<button type="button" class="btn sm primary" id="st-install" style="align-self:flex-start">Install app</button>`:""}</div>`}
    <button class="btn dark" style="padding:13px">Save settings</button></form>`);
  $("st-trySpend").onclick=()=>{closeSheet();openSpendReminder(dayStr(new Date()))};
  $("st-tryWork").onclick=()=>{closeSheet();openWorkReminder(dayStr(new Date()))};
  $("st-sync").onclick=()=>{syncNow(true)};
  $("st-out").onclick=()=>{if(!arm($("st-out")))return;if(OUT.length&&navigator.onLine!==false){toast("Sending your last changes first…");syncNow().then(()=>{closeSheet();signOut()})}else{closeSheet();signOut()}};
  if($("st-install"))$("st-install").onclick=doInstall;
  $("setForm").onsubmit=async e=>{e.preventDefault();
    S.cur=$("st-cur").value;try{localStorage.setItem("md-cur",S.cur)}catch(x){}
    const r2={...rem(),spendOn:$("st-spend").checked,spendTime:$("st-spendTime").value||"20:00",workOn:$("st-work").checked,workTime:$("st-workTime").value||"17:00"};
    closeSheet();await save("settings","reminders",r2);render();toast("Settings saved")}}

/* ---------- sign in ---------- */
let authMode="in";
const appUrl=()=>location.origin+location.pathname;
function showAuth(msg){$("auth").hidden=false;$("authMsg").textContent=msg||"Your diary, work tasks and money in one place. Works without internet and syncs between your phone and computer.";setAuthMode(authMode==="newpass"?"newpass":authMode)}
function setAuthMode(m){authMode=m;
  $("authSeg").hidden=m==="newpass"||m==="reset";
  $("authSeg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===m)));
  $("au-go").textContent=m==="up"?"Create account":m==="reset"?"Send reset link":m==="newpass"?"Save new password":"Sign in";
  $("au-pass-wrap").hidden=m==="reset";$("au-pass").required=m!=="reset";
  $("au-email-wrap").hidden=m==="newpass";$("au-email").required=m!=="newpass";
  $("au-pass").autocomplete=m==="in"?"current-password":"new-password";
  $("au-forgot").hidden=m!=="in";$("au-back").hidden=m!=="reset";$("au-err").textContent=""}
function friendlyAuth(m){m=String(m||"");
  if(/invalid login/i.test(m))return "Wrong email or password.";
  if(/not confirmed/i.test(m))return "Please confirm your email first. Open the link we sent you.";
  if(/already (been )?registered|already exists/i.test(m))return "That email already has an account. Tap Sign in.";
  if(/at least 6|password should be/i.test(m))return "Use a password with at least 6 characters.";
  if(/failed to fetch|networkerror|load failed/i.test(m))return "Can't reach the server. Check your internet and try again.";
  return m}
async function afterSignIn(j){
  if(!j.user)j.user=await authFetch("/auth/v1/user",null,"GET",j.access_token);
  if(S.uid&&S.uid!==j.user.id){COLS.forEach(c=>S[c]=[]);OUT=[];S.lastPull="";S.lastSync=0}
  setSession(j);AUTH.expired=false;S.uid=j.user.id;S.ready=true;persistNow();
  $("auth").hidden=true;render();updateSync();await syncNow();setTimeout(checkReminders,1500)}
async function signOut(){AUTH.session=null;AUTH.expired=false;COLS.forEach(c=>S[c]=[]);OUT=[];S.lastPull="";S.lastSync=0;S.uid="";S.ready=false;
  await IDB.clear();render();updateSync();setAuthMode("in");showAuth("You're signed out.")}
$("authSeg").onclick=e=>{const b=e.target.closest("button");if(b)setAuthMode(b.dataset.mode)};
$("au-forgot").onclick=()=>setAuthMode("reset");
$("au-back").onclick=()=>setAuthMode("in");
$("authForm").onsubmit=async e=>{e.preventDefault();const email=$("au-email").value.trim(),pass=$("au-pass").value;
  $("au-err").textContent="";$("au-go").disabled=true;
  try{
    if(navigator.onLine===false)throw new Error("You need internet to sign in the first time. After that, the app works offline.");
    if(authMode==="in")await afterSignIn(await authFetch("/auth/v1/token?grant_type=password",{email,password:pass}));
    else if(authMode==="up"){const j=await authFetch("/auth/v1/signup?redirect_to="+encodeURIComponent(appUrl()),{email,password:pass});
      if(j&&j.access_token)await afterSignIn(j);
      else{setAuthMode("in");$("authMsg").textContent=`Almost done. We sent a confirmation link to ${email}. Open it, then come back here and sign in.`}}
    else if(authMode==="reset"){await authFetch("/auth/v1/recover?redirect_to="+encodeURIComponent(appUrl()),{email});
      setAuthMode("in");$("authMsg").textContent="If that email has an account, a reset link is on its way. Open it on this device."}
    else if(authMode==="newpass"){await authFetch("/auth/v1/user",{password:pass},"PUT",AUTH.pending.access_token);
      const p=AUTH.pending;AUTH.pending=null;authMode="in";await afterSignIn(p);toast("Password changed")}
  }catch(err){$("au-err").textContent=friendlyAuth(err.message)}
  finally{$("au-go").disabled=false}};
function readAuthHash(){const h=new URLSearchParams(location.hash.slice(1));
  if(!h.get("access_token")&&!h.get("error_description"))return null;
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  if(h.get("error_description"))return {error:h.get("error_description")};
  return {access_token:h.get("access_token"),refresh_token:h.get("refresh_token"),expires_at:+h.get("expires_at")||0,expires_in:+h.get("expires_in")||3600,type:h.get("type")}}

/* ---------- install on phone ---------- */
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e});
const isStandalone=()=>window.matchMedia?.("(display-mode: standalone)").matches||navigator.standalone===true;
async function doInstall(){if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;closeSheet()}

/* ---------- boot ---------- */
(async()=>{
  const st=await IDB.get("state");if(st&&typeof st==="object")COLS.forEach(k=>{if(Array.isArray(st[k]))S[k]=st[k]});
  const ob=await IDB.get("outbox");OUT=Array.isArray(ob)?ob:[];
  const meta=(await IDB.get("meta"))||{};S.uid=meta.uid||"";S.lastPull=meta.lastPull||"";S.lastSync=meta.lastSync||0;
  AUTH.session=(await IDB.get("session"))||null;
  $("notice").hidden=true;
  const h=readAuthHash();
  if(h&&h.error)showAuth(friendlyAuth(h.error));
  else if(h&&h.type==="recovery"){AUTH.pending=h;authMode="newpass";showAuth("Choose a new password for your account.")}
  else if(h){try{await afterSignIn(h);toast(h.type==="signup"?"Email confirmed. Welcome!":"Signed in")}catch(e){showAuth("That link didn't work. Please sign in.")}}
  else if(!AUTH.session)showAuth();
  S.ready=!!AUTH.session;render();updateSync();
  if(AUTH.session)syncNow();
  setTimeout(checkReminders,2500);
})();
setInterval(()=>{if(document.visibilityState==="visible"){syncNow();checkReminders()}},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){syncNow();checkReminders()}else persistNow()});
window.addEventListener("pagehide",persistNow);
window.addEventListener("online",()=>{updateSync();syncNow()});
window.addEventListener("offline",updateSync);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
